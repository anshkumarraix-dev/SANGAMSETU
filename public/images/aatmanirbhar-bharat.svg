<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <linearGradient id="saffronWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="greenWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#006400"/>
    </linearGradient>
  </defs>

  <!-- Flowing Tricolor Ribbon Waves -->
  <!-- Saffron Upper Wave -->
  <path d="M160 5 C150 45 175 75 230 85 C295 95 340 120 370 145 C355 125 310 85 240 60 C195 45 180 15 160 5 Z" fill="url(#saffronWave)"/>
  
  <!-- White Middle Wave -->
  <path d="M140 40 C135 70 160 95 210 108 C265 120 310 145 345 175 C330 150 280 115 220 95 C175 80 155 55 140 40 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Green Lower Wave -->
  <path d="M120 85 C115 110 140 135 185 145 C240 158 285 180 320 215 C305 190 260 155 200 135 C155 120 135 95 120 85 Z" fill="url(#greenWave)"/>

  <!-- Ashoka Chakra (Navy Blue, 24 Spokes) -->
  <g transform="translate(325, 175)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#0A2540" stroke-width="5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0A2540" stroke-width="1.5"/>
    <!-- Inner Hub -->
    <circle cx="0" cy="0" r="10" fill="#0A2540"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    
    <!-- 24 Spokes -->
    <g stroke="#0A2540" stroke-width="2.5">
      <line x1="0" y1="-10" x2="0" y2="-40"/>
      <line x1="0" y1="10" x2="0" y2="40"/>
      <line x1="-10" y1="0" x2="-40" y2="0"/>
      <line x1="10" y1="0" x2="40" y2="0"/>
      <line x1="-7" y1="-7" x2="-28" y2="-28"/>
      <line x1="7" y1="7" x2="28" y2="28"/>
      <line x1="-7" y1="7" x2="-28" y2="28"/>
      <line x1="7" y1="-7" x2="28" y2="-28"/>
      <!-- Additional Spokes at 15 deg intervals -->
      <line x1="-2.5" y1="-9.6" x2="-10.3" y2="-38.6"/>
      <line x1="2.5" y1="9.6" x2="10.3" y2="38.6"/>
      <line x1="-9.6" y1="-2.5" x2="-38.6" y2="-10.3"/>
      <line x1="9.6" y1="2.5" x2="38.6" y2="10.3"/>
      <line x1="-2.5" y1="9.6" x2="-10.3" y2="38.6"/>
      <line x1="2.5" y1="-9.6" x2="10.3" y2="-38.6"/>
      <line x1="-9.6" y1="2.5" x2="-38.6" y2="10.3"/>
      <line x1="9.6" y1="-2.5" x2="38.6" y2="-10.3"/>
      <line x1="-8.6" y1="-5" x2="-34.6" y2="-20"/>
      <line x1="8.6" y1="5" x2="34.6" y2="20"/>
      <line x1="-5" y1="-8.6" x2="-20" y2="-34.6"/>
      <line x1="5" y1="8.6" x2="20" y2="34.6"/>
      <line x1="-8.6" y1="5" x2="-34.6" y2="20"/>
      <line x1="8.6" y1="-5" x2="34.6" y2="-20"/>
      <line x1="-5" y1="8.6" x2="-20" y2="34.6"/>
      <line x1="5" y1="-8.6" x2="20" y2="-34.6"/>
    </g>
  </g>

  <!-- Typography: "आत्मनिर्भर भारत अभियान" -->
  <g fill="#0A2540" font-family="'Noto Sans Devanagari', 'Mukta', sans-serif" font-weight="900">
    <text x="25" y="195" font-size="52" letter-spacing="-0.5">आत्मनिर्भर</text>
    <text x="75" y="270" font-size="64" letter-spacing="1">भारत</text>
    <text x="90" y="325" font-size="44" letter-spacing="2">अभियान</text>
  </g>
</svg>
